<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KKL Performans Takip v3.0 (AI & SQL)</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { color: #2c3e50; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .form-group { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        input, select, button { padding: 10px 14px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        input[type="text"], input[type="number"] { flex: 1; min-width: 150px; }
        button { background: #27ae60; color: white; border: none; cursor: pointer; transition: 0.2s; }
        button:hover { background: #219150; }
        button.ai-btn { background: #8e44ad; }
        button.ai-btn:hover { background: #732d91; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #e1e8ed; padding: 12px; text-align: left; }
        th { background: #f8f9fa; color: #333; }
        .ai-box { margin-top: 25px; padding: 15px; background: #f3e5f5; border-left: 5px solid #8e44ad; border-radius: 4px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>KKL Performans Takip v3.0</h2>

    <!-- Veri Giriş Formu -->
    <div class="form-group">
        <input type="text" id="personel" placeholder="Personel Adı" required>
        <input type="text" id="isTanimi" placeholder="Yapılan İş" required>
        <input type="number" id="sure" placeholder="Süre (DK)" required>
        <button onclick="veriEkle()">Canlı Kaydet (SQL)</button>
    </div>

    <hr>

    <!-- Yapay Zeka Raporlama Butonu -->
    <button class="ai-btn" onclick="aiAnalizEt()">✨ Gemini ile Ekip Analizi Yap</button>

    <!-- AI Sonuç Kutusu -->
    <div id="aiResult" class="ai-box">
        <strong>🤖 AI Performans Değerlendirmesi:</strong>
        <p id="aiText">Analiz hazırlanıyor...</p>
    </div>

    <!-- Canlı Veri Tablosu -->
    <h3>Ortak Veritabanı Kayıtları</h3>
    <table>
        <thead>
            <tr>
                <th>Tarih</th>
                <th>Personel</th>
                <th>İş Tanımı</th>
                <th>Süre (DK)</th>
            </tr>
        </thead>
        <tbody id="veriTablosu">
            <tr><td colspan="4">Veriler yükleniyor...</td></tr>
        </tbody>
    </table>
</div>

<script>
    // 1. SUPABASE BİLGİLERİNİZİ BURAYA YAZIN
    const SUPABASE_URL = "BURAYA_SUPABASE_PROJECT_URL_YAZIN";
    const SUPABASE_KEY = "BURAYA_SUPABASE_ANON_KEY_YAZIN";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 2. GOOGLE AI STUDIO API ANAHTARINIZI BURAYA YAZIN
    const GEMINI_API_KEY = "BURAYA_GOOGLE_AI_STUDIO_API_KEY_YAZIN";

    // Sayfa Açıldığında Verileri Getir
    window.onload = verileriGetir;

    async function verileriGetir() {
        const { data, error } = await _supabase
            .from('performance_logs')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) {
            console.error(error);
            return;
        }

        const tbody = document.getElementById('veriTablosu');
        tbody.innerHTML = '';
        
        data.forEach(row => {
            const tr = document.createElement('tr');
            const tarih = new Date(row.created_at).toLocaleString('tr-TR');
            tr.innerHTML = `<td>${tarih}</td><td>${row.personel_adi}</td><td>${row.is_tanimi}</td><td>${row.sure_dk}</td>`;
            tbody.appendChild(tr);
        });
    }

    async function veriEkle() {
        const personel_adi = document.getElementById('personel').value;
        const is_tanimi = document.getElementById('isTanimi').value;
        const sure_dk = document.getElementById('sure').value;

        if(!personel_adi || !is_tanimi || !sure_dk) {
            alert("Lütfen tüm alanları doldurun.");
            return;
        }

        const { error } = await _supabase
            .from('performance_logs')
            .insert([{ personel_adi, is_tanimi, sure_dk: parseFloat(sure_dk) }]);

        if (error) {
            alert("Hata oluştu: " + error.message);
        } else {
            document.getElementById('isTanimi').value = '';
            document.getElementById('sure').value = '';
            verileriGetir();
        }
    }

    async function aiAnalizEt() {
        const aiBox = document.getElementById('aiResult');
        const aiText = document.getElementById('aiText');
        aiBox.style.display = 'block';
        aiText.innerText = 'Veriler analiz ediliyor, lütfen bekleyin...';

        // Veritabanındaki verileri çek
        const { data } = await _supabase.from('performance_logs').select('personel_adi, is_tanimi, sure_dk');

        if(!data || data.length === 0) {
            aiText.innerText = 'Analiz yapabilmek için henüz veritabanında kayıt yok.';
            return;
        }

        const prompt = `Aşağıdaki ekip performans verilerini incele ve yönetici için 3 maddelik kısa bir özet ve tavsiye raporu çıkar:\n` + JSON.stringify(data);

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            const resData = await response.json();
            const reply = resData.candidates[0].content.parts[0].text;
            aiText.innerText = reply;
        } catch (err) {
            aiText.innerText = "AI Bağlantı hatası: API anahtarınızı kontrol edin.";
        }
    }
</script>
</body>
</html>
